<!DOCTYPE html>
<html>
<head>
    <title>Pick Your Nose Ring 💍</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
            text-align: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        h1 {
            margin-top: 40px;
            color: #ff4b7d;
        }

        .container {
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }

        .option {
            margin: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .option img {
            width: 200px;
            border-radius: 15px;
        }

        .option:hover {
            transform: scale(1.1);
        }

        .celebrate {
            position: absolute;
            font-size: 30px;
            animation: floatUp 4s linear forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100vh); opacity: 0; }
        }
    </style>
</head>
<body>

<h1>Which one do you like? 💍✨</h1>

<div class="container">
    <div class="option" onclick="celebrate()">
        <img src="ringA.jpg" alt="Ring A">
        <p>Option A</p>
    </div>

    <div class="option" onclick="celebrate()">
        <img src="ringB.jpg" alt="Ring B">
        <p>Option B</p>
    </div>
</div>

<h2 id="message"></h2>

<script>
    function celebrate() {
        document.getElementById("message").innerHTML =
            "Yayyy!! 🎉 Take a screenshot and send it to me 😍💖";

        for (let i = 0; i < 20; i++) {
            const el = document.createElement("div");
            el.classList.add("celebrate");
            el.innerHTML = Math.random() > 0.5 ? "🎈" : "❤️";
            el.style.left = Math.random() * 100 + "vw";
            el.style.top = "80vh";
            document.body.appendChild(el);

            setTimeout(() => el.remove(), 4000);
        }
    }
</script>

</body>
</html>
